# Verify a PUBLISHED DeepSeek Harness Audio (Local Build) GitHub Release: the release assets (arm64 dmg + plugin
# tarballs + SHA256SUMS) are bound to the git tree of their tag, and the packaged app from the dmg is launched and its
# Plugins window driven on a GitHub-hosted Apple-silicon macOS runner.
#
# What a green run means: hosted checks of the published bytes passed (see the job summary / evidence.json).
# What it does NOT mean: release acceptance. Real DGX servers, a physical microphone, speaker/audio quality,
# Gatekeeper first open, notarization and a second physical Mac are outside GitHub-hosted runners (ci/README.md).
#
# Quota: the macOS job (billed at the macOS rate) runs only for release: published, workflow_dispatch, and pull requests
# carrying the label `macos-ci`. Other PR / push runs check sources on ubuntu and say so in the summary.
#
# Security: read-only GITHUB_TOKEN, no secrets, no self-hosted runners, pull_request (never pull_request_target),
# third-party code is not executed except the pinned playwright-core / @electron/fuses from ci/package-lock.json.
name: Release artifact verification

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (empty = newest published release)
        required: false
        default: ''
      lifecycle:
        description: Also drive the Plugins window (Install from File / Remove / Disable / Enable)
        type: boolean
        default: true
      desktop_phases:
        description: macOS phases to run (comma list of launch, lifecycle, ci-env, availability, fixture-capture)
        required: false
        default: 'launch,lifecycle,ci-env,availability,fixture-capture'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - .github/workflows/release-artifact-verify.yml
      - ci/**
  push:
    branches: [main]
    paths:
      - .github/workflows/release-artifact-verify.yml
      - ci/**

permissions:
  contents: read

concurrency:
  group: release-artifact-verify-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '24'
  DESKTOP_PHASES: ${{ format(',{0},', inputs.desktop_phases || 'launch,lifecycle,ci-env,availability,fixture-capture') }}

jobs:
  target:
    name: Resolve release target
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      tag_commit: ${{ steps.resolve.outputs.tag_commit }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CI_COMMIT: ${{ github.sha }}
          CI_REF: ${{ github.ref }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release) TAG="$RELEASE_TAG" ;;
            workflow_dispatch) TAG="$INPUT_TAG" ;;
            *) TAG="" ;;
          esac
          if [ -z "$TAG" ]; then
            TAG="$(gh api "repos/$REPO/releases?per_page=30" --jq '[.[] | select(.draft == false)] | sort_by(.published_at) | last | .tag_name')"
          fi
          [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::invalid or missing release tag '$TAG'"; exit 2; }
          mkdir -p target
          gh api "repos/$REPO/releases/tags/$TAG" > target/release.json
          TAG_COMMIT="$(gh api "repos/$REPO/commits/$TAG" --jq .sha)"
          jq -n --arg tag "$TAG" --arg tagCommit "$TAG_COMMIT" --arg event "$EVENT" --arg ciCommit "$CI_COMMIT" --arg ciRef "$CI_REF" \
            --arg workflowRef "$WORKFLOW_REF" --arg runUrl "$RUN_URL" --arg runId "$RUN_ID" --arg runAttempt "$RUN_ATTEMPT" --arg repository "$REPO" \
            --slurpfile release target/release.json \
            '{tag: $tag, tagCommit: $tagCommit, releaseId: $release[0].id, releaseName: $release[0].name, prerelease: $release[0].prerelease,
              publishedAt: $release[0].published_at, event: $event, ciCommit: $ciCommit, ciRef: $ciRef, workflowRef: $workflowRef,
              repository: $repository, runId: $runId, runAttempt: $runAttempt, runUrl: $runUrl}' > target/target.json
          cat target/target.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "tag_commit=$TAG_COMMIT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-target
          path: target/
          retention-days: 14

  sources:
    name: Release assets ↔ tag tree
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ needs.target.outputs.tag }}
      TAG_COMMIT: ${{ needs.target.outputs.tag_commit }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.target.outputs.tag }}
          path: tag-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Tag tree is the resolved commit
        run: test "$(git -C tag-src rev-parse HEAD)" = "$TAG_COMMIT"
      - name: Download release assets (without the dmg)
        run: |
          set -euo pipefail
          mkdir -p assets reports
          gh api "repos/$REPO/releases/tags/$TAG" > assets/release.json
          gh release download "$TAG" -R "$REPO" -D assets --pattern '*.tgz' --pattern 'SHA256SUMS' --pattern '*.md'
          ls -la assets
      - name: Verify release assets against the tag tree
        run: node ci-src/ci/scripts/verify-release-sources.mjs --tag "$TAG" --tag-src tag-src --assets assets --release-json assets/release.json --out reports/sources.json
      - name: Verify the patch stack applies to the pinned upstream commit
        if: always()
        run: bash ci-src/ci/scripts/verify-patch-stack.sh tag-src reports/patch-stack.json
      - name: Negative controls (verifier must reject broken inputs)
        if: always()
        run: node ci-src/ci/scripts/negative-controls.mjs --mode sources --tag "$TAG" --tag-src tag-src --assets assets --release-json assets/release.json --out reports/negative-sources.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-sources
          path: reports/
          retention-days: 14

  availability:
    name: Service availability scenarios (deterministic, real plugin code)
    needs: target
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TAG: ${{ needs.target.outputs.tag }}
      TAG_COMMIT: ${{ needs.target.outputs.tag_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        with:
          ref: refs/tags/${{ needs.target.outputs.tag }}
          path: tag-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ci-src/ci/availability/package-lock.json
      - name: Install pinned test dependencies (cordis, dsh-llm, schemastery, tsx from npm)
        run: npm ci --ignore-scripts --prefix ci-src/ci/availability
      - name: Run owner unit tests + CI scenario tests against the tree's plugin sources (loopback fakes only)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # PR/push: the sources under review. Release/dispatch: the released tag tree.
          if [ "$EVENT" = release ] || [ "$EVENT" = workflow_dispatch ]; then
            test "$(git -C tag-src rev-parse HEAD)" = "$TAG_COMMIT"
            TREE=tag-src; LABEL="tag $TAG ($TAG_COMMIT)"
          else
            TREE=ci-src; LABEL="$EVENT tree $(git -C ci-src rev-parse HEAD)"
          fi
          node ci-src/ci/availability/run.mjs --tree "$TREE" --out reports/availability --label "$LABEL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-availability
          path: reports/
          retention-days: 14

  desktop:
    name: Packaged app on macOS arm64 (hosted)
    needs: target
    if: >-
      github.event_name == 'release' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'macos-ci'))
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ needs.target.outputs.tag }}
      TAG_COMMIT: ${{ needs.target.outputs.tag_commit }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.target.outputs.tag }}
          path: tag-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ci-src/ci/package-lock.json
      - name: Runner facts
        run: |
          set -euo pipefail
          mkdir -p reports
          { sw_vers; uname -m; sysctl -n machdep.cpu.brand_string; echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"; csrutil status || true; system_profiler SPAudioDataType 2>/dev/null | head -40 || true; } | tee reports/runner-facts.txt
          test "$(git -C tag-src rev-parse HEAD)" = "$TAG_COMMIT"
      - name: Install CI tooling (pinned lockfile)
        run: npm ci --ignore-scripts --prefix ci-src/ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: contains(env.DESKTOP_PHASES, ',fixture-capture,')
        with:
          python-version: '3.12'
      - name: Python analysis dependencies for the fixture-capture harness (pinned)
        if: contains(env.DESKTOP_PHASES, ',fixture-capture,')
        run: python -m pip install --disable-pip-version-check -r ci-src/ci/fixture-capture/requirements.txt
      - name: Download all release assets from GitHub
        run: |
          set -euo pipefail
          mkdir -p assets
          gh api "repos/$REPO/releases/tags/$TAG" > assets/release.json
          start=$(date +%s)
          gh release download "$TAG" -R "$REPO" -D assets
          end=$(date +%s)
          bytes=$(find assets -type f ! -name release.json -exec stat -f %z {} + | awk '{s+=$1} END {print s}')
          jq -n --arg tag "$TAG" --argjson seconds "$((end - start))" --argjson bytes "$bytes" \
            '{schemaVersion: 1, report: "download-assets", verdict: "pass", meta: {tag: $tag, seconds: $seconds, bytes: $bytes},
              checks: [{id: "download.timing", status: "info", evidence: "release-artifact", summary: "gh release download on the hosted runner (digests are checked by verify-desktop-artifact)"}]}' > reports/download.json
          ls -la assets
      - name: Verify dmg and packaged app (static)
        id: artifact
        run: node ci-src/ci/scripts/verify-desktop-artifact.mjs --tag "$TAG" --tag-src tag-src --assets assets --release-json assets/release.json --work "$RUNNER_TEMP/artifact" --out reports/artifact.json --copy-app-to "$RUNNER_TEMP/app"
      - name: Negative control (seed vs altered PLUGINS.json)
        if: always() && steps.artifact.outcome != 'skipped'
        run: node ci-src/ci/scripts/negative-controls.mjs --mode artifact --tag "$TAG" --tag-src tag-src --assets assets --release-json assets/release.json --out reports/negative-artifact.json
      - name: Launch smoke (published app, isolated home, no model server)
        if: always() && steps.artifact.outcome == 'success' && contains(env.DESKTOP_PHASES, ',launch,')
        timeout-minutes: 20
        run: node ci-src/ci/scripts/desktop-smoke.mjs --phase launch --app "$RUNNER_TEMP/app/DeepSeek Harness Audio (Local Build).app" --tag "$TAG" --tag-src tag-src --assets assets --out-dir reports/smoke
      - name: Plugins window lifecycle (Install from File / Remove / Disable / Enable)
        if: always() && steps.artifact.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.lifecycle) && contains(env.DESKTOP_PHASES, ',lifecycle,')
        timeout-minutes: 20
        run: node ci-src/ci/scripts/desktop-smoke.mjs --phase lifecycle --app "$RUNNER_TEMP/app/DeepSeek Harness Audio (Local Build).app" --tag "$TAG" --tag-src tag-src --assets assets --out-dir reports/smoke
      - name: Plugins lifecycle with CI=true in the app environment (known-defect registry)
        if: always() && steps.artifact.outcome == 'success' && (github.event_name != 'workflow_dispatch' || inputs.lifecycle) && contains(env.DESKTOP_PHASES, ',ci-env,')
        timeout-minutes: 15
        run: node ci-src/ci/scripts/desktop-smoke.mjs --phase ci-env --app "$RUNNER_TEMP/app/DeepSeek Harness Audio (Local Build).app" --tag "$TAG" --tag-src tag-src --assets assets --out-dir reports/smoke
      - name: Service availability in the packaged app (mock backend + fault switch; A2 with the mic owner fixture capture)
        if: always() && steps.artifact.outcome == 'success' && contains(env.DESKTOP_PHASES, ',availability,')
        timeout-minutes: 20
        env:
          HARNESS: ci-src/ci/fixture-capture/harness-1.0.0/parallel-work/microphone-ui
        run: node ci-src/ci/scripts/desktop-availability.mjs --app "$RUNNER_TEMP/app/DeepSeek Harness Audio (Local Build).app" --tag "$TAG" --tag-src tag-src --out-dir reports/smoke --capture-adapter "$HARNESS/e2e/fixture-capture-source.page.js" --fixtures "$HARNESS/fixtures/ci-jfk"
      - name: Fixture-capture desktop cases (mic owner harness 1.0.0 on the release app; capture=fixture, backend=mock)
        if: always() && steps.artifact.outcome == 'success' && contains(env.DESKTOP_PHASES, ',fixture-capture,')
        timeout-minutes: 25
        run: |
          set -uo pipefail
          OUT="$RUNNER_TEMP/fixture-capture"
          PYTHON="$(command -v python)" zsh ci-src/ci/fixture-capture/run-release-app.sh --app "$RUNNER_TEMP/app/DeepSeek Harness Audio (Local Build).app" --out "$OUT" --fixtures ci-jfk 2>&1 | tee "$RUNNER_TEMP/fixture-capture.log"
          echo "harness runner exit: ${PIPESTATUS[0]}"
          mkdir -p reports/fixture-capture/run
          cp "$RUNNER_TEMP/fixture-capture.log" reports/fixture-capture/ || true
          rsync -a --exclude 'home 家/profiles' --exclude 'home 家/desktop-audio' --exclude 'userdata 使用者' --exclude '*.tgz' "$OUT/" reports/fixture-capture/run/ || true
          node ci-src/ci/fixture-capture/report.mjs --out "$OUT" --report reports/fixture-capture/report.json --tag "$TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-desktop
          path: reports/
          retention-days: 14
          if-no-files-found: warn

  summary:
    name: Evidence summary
    needs: [target, sources, availability, desktop]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ci-src
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: reports-*
          path: all-reports
      - name: Aggregate (a missing or failed required report fails the run)
        env:
          DESKTOP_RESULT: ${{ needs.desktop.result }}
          REQUIRED_SOURCES: verify-release-sources,verify-patch-stack,negative-controls-sources,availability-suites,availability-scenarios
          LIFECYCLE: ${{ github.event_name != 'workflow_dispatch' || inputs.lifecycle }}
        run: |
          set -euo pipefail
          if [ "$DESKTOP_RESULT" = skipped ]; then
            REQUIRED="$REQUIRED_SOURCES"; SCOPE=sources-only
          else
            REQUIRED="$REQUIRED_SOURCES,verify-desktop-artifact,negative-controls-artifact"
            case "$DESKTOP_PHASES" in *,launch,*) REQUIRED="$REQUIRED,desktop-smoke-launch" ;; esac
            if [ "$LIFECYCLE" = true ]; then
              case "$DESKTOP_PHASES" in *,lifecycle,*) REQUIRED="$REQUIRED,desktop-smoke-lifecycle" ;; esac
              case "$DESKTOP_PHASES" in *,ci-env,*) REQUIRED="$REQUIRED,desktop-smoke-ci-env" ;; esac
            fi
            case "$DESKTOP_PHASES" in *,availability,*) REQUIRED="$REQUIRED,desktop-availability" ;; esac
            case "$DESKTOP_PHASES" in *,fixture-capture,*) REQUIRED="$REQUIRED,desktop-fixture-capture" ;; esac
            SCOPE=full
          fi
          node ci-src/ci/scripts/summarize.mjs --reports all-reports --target all-reports/reports-target/target.json --required "$REQUIRED" --scope "$SCOPE" --out evidence.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence
          path: evidence.json
          retention-days: 30
